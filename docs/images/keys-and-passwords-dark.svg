<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="462" viewBox="0 0 1200 462" role="img" aria-labelledby="title desc">
  <title id="title">Keys and passwords</title>
  <desc id="desc">How a key gets into a brain. A text editor window shows the file .env. Line 1 reads TRACKER_TOKEN= with the cursor after it: paste your key here. Line 2 reads INVOICES_KEY=op://Private/Invoices/key: or a 1Password reference. Three steps: 1, Claude adds the key's name; 2, the file opens in your text editor; 3, paste, save, close. Below, a chat bubble holding a key is crossed out: never paste a key into the chat. A note: this file stays on your computer and is never saved in the brain's history.</desc>
  <style>
    .serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'DejaVu Serif', serif; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .card { fill: #24211C; stroke: #3A352D; stroke-width: 2; }
    .code { font-size: 18px; fill: #F0EAE0; }
    .ln { font-size: 16px; fill: #7D7567; }
    .call { fill: #24211C; stroke: #5BBDB2; stroke-width: 1.5; }
    .calltext { font-size: 16px; fill: #5BBDB2; }
    .num { font-size: 17px; fill: #24211C; font-weight: 700; }
    .step { font-size: 17.5px; fill: #F0EAE0; }
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#2E2A23"/>
    </pattern>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <marker id="teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5BBDB2"/>
    </marker>
  </defs>

  <rect width="1200" height="462" rx="24" fill="#1B1915"/>
  <rect width="1200" height="462" rx="24" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="460" rx="23" fill="none" stroke="#3A352D" stroke-width="2"/>
  <text x="44" y="56" class="mono" font-size="16" letter-spacing="3" fill="#E57D50">KEYS AND PASSWORDS</text>

  <!-- the .env file in a text editor -->
  <g filter="url(#lift)"><rect class="card" x="44" y="84" width="660" height="232" rx="16"/></g>
  <path d="M45 99 a15 15 0 0 1 15 -15 h628 a15 15 0 0 1 15 15 v25 h-658 z" fill="#2E2A24"/>
  <circle cx="66" cy="104" r="5.5" fill="#D98466"/><circle cx="84" cy="104" r="5.5" fill="#DDB45F"/><circle cx="102" cy="104" r="5.5" fill="#7FB0A6"/>
  <text x="374" y="110" class="mono" font-size="15" fill="#A39A8B" text-anchor="middle">.env</text>
  <path d="M45 124 h52 v191 h-37 a15 15 0 0 1 -15 -15 z" fill="#2A2620"/>
  <g class="mono ln" text-anchor="end">
    <text x="84" y="170">1</text>
    <text x="84" y="218">2</text>
    <text x="84" y="266">3</text>
  </g>
  <text x="116" y="170" class="mono code">TRACKER_TOKEN=</text>
  <rect x="270" y="153" width="10" height="22" fill="#E57D50" opacity="0.8"/>
  <line x1="326" y1="164" x2="292" y2="164" stroke="#5BBDB2" stroke-width="2" marker-end="url(#teal)"/>
  <rect class="call" x="330" y="147" width="196" height="34" rx="17"/>
  <text x="428" y="169" class="sans calltext" text-anchor="middle">paste your key here</text>

  <text x="116" y="218" class="mono code">INVOICES_KEY=op://Private/Invoices/key</text>
  <line x1="258" y1="228" x2="528" y2="228" stroke="#5BBDB2" stroke-width="2"/>
  <line x1="393" y1="228" x2="393" y2="246" stroke="#5BBDB2" stroke-width="2"/>
  <rect class="call" x="281" y="246" width="224" height="34" rx="17"/>
  <text x="393" y="268" class="sans calltext" text-anchor="middle">or a 1Password reference</text>

  <!-- the three steps -->
  <rect class="card" x="736" y="84" width="420" height="232" rx="16"/>
  <line x1="772" y1="140" x2="772" y2="272" stroke="#6B6152" stroke-width="2" stroke-dasharray="3 6"/>
  <circle cx="772" cy="130" r="17" fill="#F0EAE0"/>
  <text x="772" y="136" class="sans num" text-anchor="middle">1</text>
  <text x="804" y="136" class="sans step">Claude adds the key's name</text>
  <circle cx="772" cy="200" r="17" fill="#E2B653"/>
  <text x="772" y="206" class="sans num" text-anchor="middle">2</text>
  <text x="804" y="206" class="sans step">the file opens in your text editor</text>
  <circle cx="772" cy="270" r="17" fill="#5BBDB2"/>
  <text x="772" y="276" class="sans num" text-anchor="middle">3</text>
  <text x="804" y="276" class="sans step">paste, save, close</text>

  <!-- never in the chat -->
  <rect x="44" y="352" width="300" height="60" rx="16" fill="#F0EAE0"/>
  <circle cx="76" cy="382" r="8" fill="none" stroke="#1B1915" stroke-width="3"/>
  <path d="M84 382 H108 M100 382 V390 M106 382 V388" fill="none" stroke="#1B1915" stroke-width="3" stroke-linecap="round"/>
  <text x="124" y="389" class="mono" font-size="18" fill="#1B1915">•••• •••• ••••</text>
  <line x1="40" y1="424" x2="348" y2="340" stroke="#E57D50" stroke-width="4.5" stroke-linecap="round"/>
  <text x="376" y="390" class="sans" font-size="20" font-weight="700" fill="#E57D50">Never paste a key into the chat.</text>

  <!-- the file stays here -->
  <rect x="736" y="350" width="420" height="72" rx="16" fill="#2A2620" stroke="#4A443A" stroke-width="1.5"/>
  <path d="M766 378 v-6 a9 9 0 0 1 18 0 v6" fill="none" stroke="#5BBDB2" stroke-width="3"/>
  <rect x="761" y="377" width="28" height="22" rx="4" fill="#5BBDB2"/>
  <text class="sans" font-size="16.5" fill="#CFC6B7"><tspan x="808" y="380">This file stays on your computer and is</tspan><tspan x="808" y="404">never saved in the brain's history.</tspan></text>
</svg>
