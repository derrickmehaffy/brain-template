<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Where a mod shows up</title>
  <desc id="desc">A Claude Code window with six places a mod can work. One: a pane beside the chat, here a health check listing what needs attention. Two: a band above the prompt saying one thing needs attention, with a Show button. Three: a slash command typed in the prompt. Four: a word in the status line under the prompt. Five: a hook on a tool call, here holding a risky command for a yes or no. Six: a toast in the corner saying what just happened.</desc>
  <style>
    .serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'DejaVu Serif', serif; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .card { fill: #FFFCF6; stroke: #E3D8C2; stroke-width: 2; }
    .body { font-size: 16px; fill: #57524A; }
    .ink { font-size: 16px; fill: #1E1D1A; }
    .muted { font-size: 14px; fill: #8A8274; }
    .num { font-size: 15px; fill: #FFFCF6; font-weight: 700; }
    .legend { font-size: 16px; fill: #57524A; }
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#DED3BD"/>
    </pattern>
  </defs>

  <rect width="1200" height="640" rx="24" fill="#F6F1E6"/>
  <rect width="1200" height="640" rx="24" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="638" rx="23" fill="none" stroke="#E3D8C2" stroke-width="2"/>
  <text x="44" y="56" class="mono" font-size="16" letter-spacing="3" fill="#B5522B">WHERE A MOD SHOWS UP</text>

  <!-- the window -->
  <rect class="card" x="44" y="80" width="1112" height="460" rx="16"/>
  <path d="M60 80 H1140 A16 16 0 0 1 1156 96 V118 H44 V96 A16 16 0 0 1 60 80 Z" fill="#EFE7D7"/>
  <line x1="44" y1="118" x2="1156" y2="118" stroke="#E3D8C2" stroke-width="2"/>
  <circle cx="70" cy="99" r="6" fill="#D98466"/>
  <circle cx="90" cy="99" r="6" fill="#DDB45F"/>
  <circle cx="110" cy="99" r="6" fill="#7FB0A6"/>
  <text x="600" y="104" class="mono muted" text-anchor="middle">Claude Code · my-homelab</text>

  <!-- the chat -->
  <rect x="380" y="140" width="300" height="38" rx="12" fill="#1E1D1A"/>
  <text x="400" y="165" class="sans" font-size="16" fill="#F6F1E6">Tidy the build folder, please.</text>
  <rect x="72" y="196" width="420" height="10" rx="5" fill="#D8CCB4"/>
  <rect x="72" y="216" width="360" height="10" rx="5" fill="#D8CCB4"/>

  <!-- 5: a hook on a tool call -->
  <rect x="72" y="244" width="608" height="84" rx="12" fill="#FFFCF6" stroke="#B5522B" stroke-width="2"/>
  <text x="92" y="272" class="mono ink">Bash  rm -rf build/ ~/old</text>
  <text x="92" y="300" class="sans body">Held: this deletes outside the project. Run it?</text>
  <rect x="512" y="284" width="60" height="28" rx="8" fill="#EFE7D7" stroke="#D8CCB4" stroke-width="1.5"/>
  <text x="542" y="303" class="sans" font-size="14" fill="#1E1D1A" text-anchor="middle">Yes</text>
  <rect x="582" y="284" width="80" height="28" rx="8" fill="#B5522B"/>
  <text x="622" y="303" class="sans" font-size="14" fill="#FFFCF6" text-anchor="middle">Cancel</text>
  <circle cx="72" cy="244" r="15" fill="#B5522B"/>
  <text x="72" y="249" class="sans num" text-anchor="middle">5</text>

  <rect x="72" y="348" width="390" height="10" rx="5" fill="#D8CCB4"/>

  <!-- 2: the band above the prompt -->
  <rect x="72" y="380" width="608" height="40" rx="10" fill="#EFE7D7"/>
  <text x="92" y="405" class="sans" font-size="16" font-weight="700" fill="#C9962E">!</text>
  <text x="108" y="405" class="sans ink" font-weight="600">Health check: 1 to look at</text>
  <text x="330" y="405" class="sans muted">· git</text>
  <rect x="592" y="387" width="72" height="26" rx="8" fill="#1E1D1A"/>
  <text x="628" y="405" class="sans" font-size="14" fill="#FFFCF6" text-anchor="middle">Show</text>
  <circle cx="72" cy="380" r="15" fill="#C9962E"/>
  <text x="72" y="385" class="sans num" text-anchor="middle">2</text>

  <!-- 3: a slash command in the prompt -->
  <rect x="72" y="430" width="608" height="48" rx="12" fill="#FFFCF6" stroke="#D8CCB4" stroke-width="2"/>
  <text x="92" y="460" class="mono ink">/lab-health refresh</text>
  <circle cx="72" cy="430" r="15" fill="#7A4E7E"/>
  <text x="72" y="435" class="sans num" text-anchor="middle">3</text>

  <!-- 4: the status line -->
  <text x="92" y="510" class="mono muted">sonnet · my-homelab · health: 1 to look at</text>
  <circle cx="72" cy="505" r="15" fill="#1E1D1A"/>
  <text x="72" y="510" class="sans num" text-anchor="middle">4</text>

  <!-- 1: a pane beside the chat -->
  <line x1="708" y1="118" x2="708" y2="540" stroke="#E3D8C2" stroke-width="2"/>
  <text x="732" y="160" class="serif" font-size="22" fill="#1E1D1A">Health</text>
  <text x="1132" y="160" class="sans muted" text-anchor="end">read 09:30 ↻</text>
  <line x1="732" y1="176" x2="1132" y2="176" stroke="#E3D8C2" stroke-width="1.5"/>
  <text x="732" y="206" class="sans" font-size="16" font-weight="700" fill="#B5522B">0</text>
  <text x="748" y="206" class="sans muted">blocking</text>
  <text x="836" y="206" class="sans" font-size="16" font-weight="700" fill="#C9962E">1</text>
  <text x="852" y="206" class="sans muted">to look at</text>
  <text x="952" y="206" class="sans" font-size="16" font-weight="700" fill="#2B7A74">11</text>
  <text x="976" y="206" class="sans muted">ok</text>
  <rect x="732" y="224" width="400" height="44" rx="10" fill="#F6F1E6" stroke="#E3D8C2" stroke-width="1.5"/>
  <text x="750" y="251" class="sans ink">git: 3 uncommitted changes</text>
  <rect x="1040" y="234" width="78" height="24" rx="12" fill="#EFE7D7"/>
  <text x="1079" y="251" class="sans" font-size="13" fill="#57524A" text-anchor="middle">look at</text>
  <text x="732" y="304" class="sans" font-size="16" font-weight="700" fill="#2B7A74">Next</text>
  <text x="732" y="330" class="sans body">Ask Claude to fix it. The request goes</text>
  <text x="732" y="352" class="sans body">in the prompt; you send it.</text>
  <rect x="732" y="370" width="92" height="30" rx="8" fill="#2B7A74"/>
  <text x="778" y="390" class="sans" font-size="14" fill="#FFFCF6" text-anchor="middle">Fix it ↵</text>
  <rect x="834" y="370" width="112" height="30" rx="8" fill="#EFE7D7"/>
  <text x="890" y="390" class="sans" font-size="14" fill="#57524A" text-anchor="middle">Explain first</text>
  <text x="732" y="436" class="sans muted">11 checks ok</text>
  <circle cx="708" cy="140" r="15" fill="#2B7A74"/>
  <text x="708" y="145" class="sans num" text-anchor="middle">1</text>

  <!-- 6: a toast -->
  <rect x="860" y="470" width="272" height="44" rx="12" fill="#1E1D1A"/>
  <text x="882" y="497" class="sans" font-size="15" fill="#F6F1E6">✓ Saved the weekly summary</text>
  <circle cx="860" cy="470" r="15" fill="#2B7A74"/>
  <text x="860" y="475" class="sans num" text-anchor="middle">6</text>

  <!-- legend -->
  <g class="sans legend">
    <text x="44" y="582"><tspan font-weight="700" fill="#2B7A74">1</tspan> a pane beside the chat</text>
    <text x="300" y="582"><tspan font-weight="700" fill="#C9962E">2</tspan> a band above the prompt</text>
    <text x="566" y="582"><tspan font-weight="700" fill="#7A4E7E">3</tspan> a slash command</text>
    <text x="44" y="612"><tspan font-weight="700" fill="#1E1D1A">4</tspan> a word in the status line</text>
    <text x="300" y="612"><tspan font-weight="700" fill="#B5522B">5</tspan> a hook on a tool call</text>
    <text x="566" y="612"><tspan font-weight="700" fill="#2B7A74">6</tspan> a toast</text>
  </g>
  <text x="1156" y="612" class="sans muted" text-anchor="end">All made by Claude, from what you ask for.</text>
</svg>
