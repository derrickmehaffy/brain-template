<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="612" viewBox="0 0 1200 612" role="img" aria-labelledby="title desc">
  <title id="title">Keys and secrets</title>
  <desc id="desc">Where a key comes from and where it goes. Two sources: .env, a file on this computer only, never saved; and 1Password, as a reference like op://vault/item/field, read at the moment it is needed. A note by .env: you paste values yourself; Claude opens the file for you. Both feed _meta/brain secret run, which hands the key to one command and prints nothing. That command is the one that needs it: an API call (curl), or an MCP server (.mcp.json). The key never reaches the chat (the session), the saved history (git history), or logs and output (stdout and stderr): all three are crossed out.</desc>
  <style>
    .serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'DejaVu Serif', serif; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .card { fill: #FFFCF6; stroke: #E3D8C2; stroke-width: 2; }
    .stage { fill: #EFE7D7; }
    .head { font-size: 24px; fill: #1E1D1A; }
    .body { font-size: 17.5px; fill: #57524A; }
    .muted { font-size: 15.5px; fill: #8A8274; }
    .note { font-size: 15.5px; fill: #57524A; }
    .detail { font-size: 14.5px; fill: #8A8274; }
    .tagtext { font-size: 14.5px; font-weight: 700; fill: #FFFCF6; }
    .feed { stroke: #8A8274; stroke-width: 2.5; fill: none; }
    .never { stroke: #B5522B; stroke-width: 2.5; stroke-dasharray: 7 6; fill: none; }
    .gone { font-size: 18px; fill: #B5522B; text-decoration: line-through; }
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#DED3BD"/>
    </pattern>
    <path id="tick" d="M-7 0.5 L-2 5.5 L7.5 -5.5" fill="none" stroke="#FFFCF6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="cross" d="M-6 -6 L6 6 M6 -6 L-6 6" fill="none" stroke="#FFFCF6" stroke-width="3.2" stroke-linecap="round"/>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A8274"/>
    </marker>
    <marker id="teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2B7A74"/>
    </marker>
  </defs>

  <rect width="1200" height="612" rx="24" fill="#F6F1E6"/>
  <rect width="1200" height="612" rx="24" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="610" rx="23" fill="none" stroke="#E3D8C2" stroke-width="2"/>
  <text x="44" y="56" class="mono" font-size="16" letter-spacing="3" fill="#B5522B">KEYS AND SECRETS</text>

  <!-- source: .env -->
  <rect class="card" x="44" y="84" width="340" height="206" rx="16"/>
  <path d="M66 105 h15 l8 8 v19 h-23 z" fill="#EFE7D7" stroke="#8A8274" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="102" y="128" class="mono" font-size="22" font-weight="700" fill="#1E1D1A">.env</text>
  <rect x="246" y="108" width="118" height="26" rx="13" fill="#B5522B"/>
  <text x="305" y="126" class="sans tagtext" text-anchor="middle">never saved</text>
  <text x="66" y="172" class="sans body">a file on this computer only</text>
  <line x1="66" y1="204" x2="362" y2="204" stroke="#D8CCB4" stroke-width="1.5" stroke-dasharray="2 5"/>
  <circle cx="80" cy="246" r="14" fill="#C9962E"/>
  <text x="80" y="252" class="sans" font-size="17" font-weight="700" fill="#FFFCF6" text-anchor="middle">!</text>
  <text class="sans note"><tspan x="106" y="240">You paste values yourself:</tspan><tspan x="106" y="263">Claude opens the file for you.</tspan></text>

  <!-- source: 1Password -->
  <rect class="card" x="44" y="312" width="340" height="132" rx="16"/>
  <circle cx="78" cy="346" r="12" fill="#EFE7D7" stroke="#8A8274" stroke-width="1.5"/>
  <circle cx="78" cy="346" r="4" fill="none" stroke="#8A8274" stroke-width="1.5"/>
  <text x="102" y="353" class="sans" font-size="20" font-weight="700" fill="#1E1D1A">1Password</text>
  <text x="66" y="392" class="mono" font-size="15" fill="#57524A">op://vault/item/field</text>
  <text x="66" y="420" class="sans muted">read at the moment it's needed</text>

  <!-- secret run -->
  <path class="feed" d="M388 190 C 420 190, 420 236, 448 236" marker-end="url(#arrow)"/>
  <path class="feed" d="M388 378 C 420 378, 420 292, 448 292" marker-end="url(#arrow)"/>
  <rect class="card" x="456" y="182" width="332" height="164" rx="16" style="stroke: #2B7A74; stroke-width: 3"/>
  <text x="480" y="224" class="mono" font-size="17" font-weight="700" fill="#1E1D1A">_meta/brain secret run</text>
  <line x1="480" y1="244" x2="764" y2="244" stroke="#E3D8C2" stroke-width="1.5"/>
  <text class="sans" font-size="18.5" fill="#1E1D1A"><tspan x="480" y="280">Hands the key to one command,</tspan><tspan x="480" y="308">and prints nothing.</tspan></text>

  <!-- the command that needs it -->
  <line x1="792" y1="264" x2="846" y2="264" stroke="#2B7A74" stroke-width="3" marker-end="url(#teal)"/>
  <rect class="card" x="854" y="150" width="302" height="228" rx="16"/>
  <text class="serif head"><tspan x="878" y="194">The command</tspan><tspan x="878" y="224">that needs it</tspan></text>
  <rect x="874" y="250" width="262" height="44" rx="22" fill="#EFE7D7"/>
  <text x="894" y="278" class="sans" font-size="17" fill="#1E1D1A">an API call</text>
  <text x="1118" y="277" class="mono detail" text-anchor="end">curl</text>
  <rect x="874" y="306" width="262" height="44" rx="22" fill="#EFE7D7"/>
  <text x="894" y="334" class="sans" font-size="17" fill="#1E1D1A">an MCP server</text>
  <text x="1118" y="333" class="mono detail" text-anchor="end">.mcp.json</text>

  <!-- never reaches -->
  <path class="never" d="M566 350 L372 486"/>
  <path class="never" d="M622 350 L622 486"/>
  <path class="never" d="M678 350 L872 486"/>
  <circle cx="465" cy="421" r="15" fill="#B5522B"/><use href="#cross" x="465" y="421"/>
  <circle cx="622" cy="421" r="15" fill="#B5522B"/><use href="#cross" x="622" y="421"/>
  <circle cx="779" cy="421" r="15" fill="#B5522B"/><use href="#cross" x="779" y="421"/>
  <text class="serif" font-size="22" fill="#1E1D1A"><tspan x="44" y="512">The key</tspan><tspan x="44" y="540">never reaches</tspan></text>
  <rect x="260" y="494" width="224" height="50" rx="25" fill="#FFFCF6" stroke="#B5522B" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="372" y="525" class="sans gone" text-anchor="middle">the chat</text>
  <text x="372" y="570" class="mono detail" text-anchor="middle">the session</text>
  <rect x="510" y="494" width="224" height="50" rx="25" fill="#FFFCF6" stroke="#B5522B" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="622" y="525" class="sans gone" text-anchor="middle">the saved history</text>
  <text x="622" y="570" class="mono detail" text-anchor="middle">git history</text>
  <rect x="760" y="494" width="224" height="50" rx="25" fill="#FFFCF6" stroke="#B5522B" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="872" y="525" class="sans gone" text-anchor="middle">logs and output</text>
  <text x="872" y="570" class="mono detail" text-anchor="middle">stdout, stderr</text>
</svg>
