<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="696" viewBox="0 0 1200 696" role="img" aria-labelledby="title desc">
  <title id="title">The privacy guard</title>
  <desc id="desc">What you're saving, a git commit, passes the guard, a pre-commit hook, which checks everything you save for five things: a .env file; a key or token, by its credential shape; your private names, from .brain-private; a file too big, over max_file_kb; another project's repo, a nested repo. If all five pass, it's all clear and the commit goes through: it's saved. If any one fails, it's blocked, and the guard names the rule, the file and the line, never the value, for example: BLOCK private-key: notes.md:12. It runs on every save. Nobody skips it, not even Claude.</desc>
  <style>
    .serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'DejaVu Serif', serif; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .card { fill: #24211C; stroke: #3A352D; stroke-width: 2; }
    .stage { fill: #2E2A24; }
    .head { font-size: 26px; fill: #F0EAE0; }
    .label { font-size: 18px; font-weight: 700; fill: #F0EAE0; }
    .detail { font-size: 14.5px; fill: #A39A8B; }
    .body { font-size: 17.5px; fill: #CFC6B7; }
    .muted { font-size: 15.5px; fill: #A39A8B; }
    .tag { font-size: 14.5px; fill: #CFC6B7; }
    .icon { fill: none; stroke: #CFC6B7; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .sheet { fill: #24211C; stroke: #4A443A; stroke-width: 2; }
    .fold { fill: #2E2A24; stroke: #4A443A; stroke-width: 2; stroke-linejoin: round; }
    .line { fill: #3A352D; }
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#2E2A23"/>
    </pattern>
    <path id="tick" d="M-7 0.5 L-2 5.5 L7.5 -5.5" fill="none" stroke="#24211C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="cross" d="M-6 -6 L6 6 M6 -6 L-6 6" fill="none" stroke="#24211C" stroke-width="3.2" stroke-linecap="round"/>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#A39A8B"/>
    </marker>
    <marker id="teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5BBDB2"/>
    </marker>
    <marker id="terra" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#E57D50"/>
    </marker>
  </defs>

  <rect width="1200" height="696" rx="24" fill="#1B1915"/>
  <rect width="1200" height="696" rx="24" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="694" rx="23" fill="none" stroke="#3A352D" stroke-width="2"/>
  <text x="44" y="56" class="mono" font-size="16" letter-spacing="3" fill="#E57D50">THE PRIVACY GUARD</text>

  <!-- what you're saving -->
  <path class="sheet" d="M56 176 h114 l26 26 v150 h-140 z"/>
  <path class="fold" d="M170 176 v26 h26 z"/>
  <path class="sheet" d="M72 192 h114 l26 26 v150 h-140 z"/>
  <path class="fold" d="M186 192 v26 h26 z"/>
  <path class="sheet" d="M88 208 h114 l26 26 v150 h-140 z"/>
  <path class="fold" d="M202 208 v26 h26 z"/>
  <text x="104" y="242" class="mono" font-size="14" fill="#F0EAE0">notes.md</text>
  <rect x="104" y="264" width="104" height="8" rx="4" fill="#4A443A"/>
  <rect x="104" y="286" width="88" height="8" rx="4" fill="#3A352D"/>
  <rect x="104" y="308" width="108" height="8" rx="4" fill="#3A352D"/>
  <rect x="104" y="330" width="72" height="8" rx="4" fill="#3A352D"/>
  <rect x="104" y="352" width="96" height="8" rx="4" fill="#3A352D"/>
  <text x="44" y="430" class="serif" font-size="22" fill="#F0EAE0">What you're saving</text>
  <text x="44" y="458" class="mono detail">git commit</text>
  <line x1="236" y1="296" x2="292" y2="296" stroke="#A39A8B" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- the guard: five checks -->
  <rect class="card" x="300" y="84" width="440" height="500" rx="16"/>
  <text x="324" y="128" class="serif head">The guard</text>
  <rect x="568" y="106" width="148" height="28" rx="14" fill="#2E2A24"/>
  <text x="642" y="125" class="mono tag" text-anchor="middle">pre-commit hook</text>
  <text x="324" y="160" class="sans muted">five checks on everything you save</text>
  <rect x="320" y="182" width="400" height="64" rx="32" fill="#2E2A24"/>
  <circle cx="354" cy="214" r="22" fill="#24211C" stroke="#4A443A" stroke-width="1.5"/>
  <path class="icon" d="M346 203 h10 l6 6 v16 h-16 z"/><circle cx="350" cy="218" r="1.6" fill="#CFC6B7"/><circle cx="354" cy="218" r="1.6" fill="#CFC6B7"/><circle cx="358" cy="218" r="1.6" fill="#CFC6B7"/>
  <text x="390" y="210" class="sans label">a .env file</text>
  <text x="390" y="232" class="mono detail">.env</text>
  <rect x="320" y="260" width="400" height="64" rx="32" fill="#2E2A24"/>
  <circle cx="354" cy="292" r="22" fill="#24211C" stroke="#4A443A" stroke-width="1.5"/>
  <circle class="icon" cx="348" cy="292" r="5"/><path class="icon" d="M353 292 H365 M360 292 v5 M364 292 v4"/>
  <text x="390" y="288" class="sans label">a key or token</text>
  <text x="390" y="310" class="mono detail">credential shapes</text>
  <rect x="320" y="338" width="400" height="64" rx="32" fill="#2E2A24"/>
  <circle cx="354" cy="370" r="22" fill="#24211C" stroke="#4A443A" stroke-width="1.5"/>
  <circle class="icon" cx="354" cy="365" r="4.5"/><path class="icon" d="M346 380 a8 7.5 0 0 1 16 0"/>
  <text x="390" y="366" class="sans label">your private names</text>
  <text x="390" y="388" class="mono detail">.brain-private</text>
  <rect x="320" y="416" width="400" height="64" rx="32" fill="#2E2A24"/>
  <circle cx="354" cy="448" r="22" fill="#24211C" stroke="#4A443A" stroke-width="1.5"/>
  <circle class="icon" cx="354" cy="441" r="3"/><path class="icon" d="M348 445 H360 L363 457 H345 z"/>
  <text x="390" y="444" class="sans label">a file too big</text>
  <text x="390" y="466" class="mono detail">max_file_kb</text>
  <rect x="320" y="494" width="400" height="64" rx="32" fill="#2E2A24"/>
  <circle cx="354" cy="526" r="22" fill="#24211C" stroke="#4A443A" stroke-width="1.5"/>
  <circle class="icon" cx="349" cy="518" r="2.6"/><circle class="icon" cx="349" cy="534" r="2.6"/><circle class="icon" cx="360" cy="523" r="2.6"/><path class="icon" d="M349 520.6 V531.4 M360 525.6 C360 530 349 527 349 531"/>
  <text x="390" y="522" class="sans label">another project's repo</text>
  <text x="390" y="544" class="mono detail">nested repo</text>

  <!-- outcomes -->
  <path d="M744 334 C 772 334, 768 205, 792 205" fill="none" stroke="#5BBDB2" stroke-width="3" marker-end="url(#teal)"/>
  <path d="M744 334 C 772 334, 768 447, 792 447" fill="none" stroke="#E57D50" stroke-width="3" marker-end="url(#terra)"/>
  <rect class="card" x="800" y="120" width="356" height="170" rx="16" style="stroke: #5BBDB2; stroke-width: 2.5"/>
  <text x="824" y="152" class="sans muted">if all five pass</text>
  <circle cx="842" cy="190" r="18" fill="#5BBDB2"/><use href="#tick" x="842" y="190"/>
  <text x="872" y="199" class="serif head">All clear</text>
  <text x="824" y="240" class="sans body">It's saved.</text>
  <text x="824" y="266" class="sans muted">the commit goes through</text>
  <rect class="card" x="800" y="318" width="356" height="266" rx="16" style="stroke: #E57D50; stroke-width: 2.5"/>
  <text x="824" y="350" class="sans muted">if any one fails</text>
  <circle cx="842" cy="388" r="18" fill="#E57D50"/><use href="#cross" x="842" y="388"/>
  <text x="872" y="397" class="serif head">Blocked</text>
  <text class="sans body"><tspan x="824" y="438">It names the rule, the file</tspan><tspan x="824" y="464">and the line, <tspan font-weight="700" fill="#F0EAE0">never the value.</tspan></tspan></text>
  <text x="824" y="500" class="sans muted">what it prints:</text>
  <rect x="820" y="514" width="316" height="44" rx="10" fill="#F0EAE0"/>
  <text x="838" y="541" class="mono" font-size="14.5" fill="#1B1915">BLOCK private-key: notes.md:12</text>

  <rect x="44" y="612" width="1112" height="52" rx="26" fill="#2E2A24"/>
  <text x="600" y="645" class="serif" font-size="22" font-style="italic" fill="#5BBDB2" text-anchor="middle">It runs on every save. Nobody skips it, not even Claude.</text>
</svg>
