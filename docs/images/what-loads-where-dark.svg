<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="712" viewBox="0 0 1200 712" role="img" aria-labelledby="title desc">
  <title id="title">What loads where</title>
  <desc id="desc">Three places a chat can start, and what loads in each. In the brain's folder, my-site: everything loads: the instructions in CLAUDE.md, the routines in .claude/skills, the safety rails in settings.json (the gate and the .env protection) and the connected apps in .mcp.json. Inside a project in the brain, my-site/site: the instructions load, the brain's and the project's own; the routines not reliably; the safety rails and the connected apps do not load. Somewhere else, with --add-dir: the routines load; the instructions, the safety rails and the connected apps do not. Start every chat in the brain's folder: the only place everything loads.</desc>
  <style>
    .serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'DejaVu Serif', serif; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .card { fill: #24211C; stroke: #3A352D; stroke-width: 2; }
    .stage { fill: #2E2A24; }
    .label { font-size: 19px; font-weight: 700; fill: #F0EAE0; }
    .what { font-size: 15.5px; fill: #CFC6B7; }
    .file { font-size: 14.5px; fill: #A39A8B; }
    .path { font-size: 17px; font-weight: 700; fill: #F0EAE0; }
    .title { font-size: 23px; fill: #F0EAE0; }
    .cell { font-size: 17px; fill: #CFC6B7; }
    .hint { font-size: 16px; fill: #A39A8B; }
    .rule { stroke: #3A352D; stroke-width: 1.5; }
    .lead { stroke: #4A443A; stroke-width: 1.5; stroke-dasharray: 2 5; }
    .tagtext { font-size: 14.5px; font-weight: 700; fill: #24211C; }
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#2E2A23"/>
    </pattern>
    <path id="tick" d="M-7 0.5 L-2 5.5 L7.5 -5.5" fill="none" stroke="#24211C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="cross" d="M-6 -6 L6 6 M6 -6 L-6 6" fill="none" stroke="#24211C" stroke-width="3.2" stroke-linecap="round"/>
    <path id="wave" d="M-8 2.5 C-5.5 -5 -2 -4.5 0 0 S5.5 5 8 -2.5" fill="none" stroke="#24211C" stroke-width="3.2" stroke-linecap="round"/>
    <path id="folder" d="M3 0 h12 l4 5 h16 a3 3 0 0 1 3 3 v10 a3 3 0 0 1 -3 3 h-32 a3 3 0 0 1 -3 -3 v-15 a3 3 0 0 1 3 -3 z" fill="#E2B653"/>
  </defs>

  <rect width="1200" height="712" rx="24" fill="#1B1915"/>
  <rect width="1200" height="712" rx="24" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="710" rx="23" fill="none" stroke="#3A352D" stroke-width="2"/>
  <text x="44" y="56" class="mono" font-size="16" letter-spacing="3" fill="#E57D50">WHAT LOADS WHERE</text>

  <!-- row labels -->
  <text x="308" y="150" class="sans hint" text-anchor="end">where the chat starts →</text>
  <text x="44" y="198" class="sans hint">what loads ↓</text>
  <text x="44" y="243" class="sans label">Instructions</text>
  <text x="44" y="267" class="sans what">how the brain works</text>
  <text x="44" y="289" class="mono file">CLAUDE.md</text>
  <text x="44" y="337" class="sans label">Routines</text>
  <text x="44" y="361" class="sans what">the brain's skills</text>
  <text x="44" y="383" class="mono file">.claude/skills</text>
  <text x="44" y="431" class="sans label">Safety rails</text>
  <text x="44" y="455" class="sans what">the gate, the .env protection</text>
  <text x="44" y="477" class="mono file">settings.json</text>
  <text x="44" y="525" class="sans label">Connected apps</text>
  <text x="44" y="549" class="sans what">other apps Claude can use</text>
  <text x="44" y="571" class="mono file">.mcp.json</text>
  <line class="lead" x1="44" y1="308" x2="308" y2="308"/>
  <line class="lead" x1="44" y1="402" x2="308" y2="402"/>
  <line class="lead" x1="44" y1="496" x2="308" y2="496"/>

  <!-- column 1: my-site/ -->
  <rect class="card" x="324" y="84" width="268" height="516" rx="16"/>
  <path d="M325 100 a15 15 0 0 1 15 -15 h236 a15 15 0 0 1 15 15 v114 h-266 z" fill="#2E2A24"/>
  <rect x="324" y="84" width="268" height="516" rx="16" fill="none" stroke="#5BBDB2" stroke-width="3"/>
  <rect x="402" y="71" width="112" height="26" rx="13" fill="#5BBDB2"/>
  <text x="458" y="89" class="sans tagtext" text-anchor="middle">start here</text>
  <use href="#folder" x="346" y="110"/>
  <text x="394" y="128" class="mono path">my-site/</text>
  <text class="serif title"><tspan x="346" y="168">In the brain's</tspan><tspan x="346" y="196">folder</tspan></text>
  <line class="rule" x1="342" y1="308" x2="574" y2="308"/>
  <line class="rule" x1="342" y1="402" x2="574" y2="402"/>
  <line class="rule" x1="342" y1="496" x2="574" y2="496"/>
  <circle cx="362" cy="261" r="16" fill="#5BBDB2"/><use href="#tick" x="362" y="261"/>
  <text x="390" y="267" class="sans cell">loads</text>
  <circle cx="362" cy="355" r="16" fill="#5BBDB2"/><use href="#tick" x="362" y="355"/>
  <text x="390" y="361" class="sans cell">loads</text>
  <circle cx="362" cy="449" r="16" fill="#5BBDB2"/><use href="#tick" x="362" y="449"/>
  <text x="390" y="455" class="sans cell">loads</text>
  <circle cx="362" cy="543" r="16" fill="#5BBDB2"/><use href="#tick" x="362" y="543"/>
  <text x="390" y="549" class="sans cell">loads</text>

  <!-- column 2: my-site/site/ -->
  <rect class="card" x="606" y="84" width="268" height="516" rx="16"/>
  <path d="M607 100 a15 15 0 0 1 15 -15 h236 a15 15 0 0 1 15 15 v114 h-266 z" fill="#2E2A24"/>
  <use href="#folder" x="628" y="110"/>
  <text x="676" y="128" class="mono path">my-site/site/</text>
  <text class="serif title"><tspan x="628" y="168">Inside a project</tspan><tspan x="628" y="196">in the brain</tspan></text>
  <line class="rule" x1="624" y1="308" x2="856" y2="308"/>
  <line class="rule" x1="624" y1="402" x2="856" y2="402"/>
  <line class="rule" x1="624" y1="496" x2="856" y2="496"/>
  <circle cx="644" cy="261" r="16" fill="#5BBDB2"/><use href="#tick" x="644" y="261"/>
  <text class="sans cell"><tspan x="672" y="256">the brain's, and</tspan><tspan x="672" y="278">the project's own</tspan></text>
  <circle cx="644" cy="355" r="16" fill="#E2B653"/><use href="#wave" x="644" y="355"/>
  <text x="672" y="361" class="sans cell">not reliably</text>
  <circle cx="644" cy="449" r="16" fill="#E57D50"/><use href="#cross" x="644" y="449"/>
  <text x="672" y="455" class="sans cell">not loaded</text>
  <circle cx="644" cy="543" r="16" fill="#E57D50"/><use href="#cross" x="644" y="543"/>
  <text x="672" y="549" class="sans cell">not loaded</text>

  <!-- column 3: elsewhere/ -->
  <rect class="card" x="888" y="84" width="268" height="516" rx="16"/>
  <path d="M889 100 a15 15 0 0 1 15 -15 h236 a15 15 0 0 1 15 15 v114 h-266 z" fill="#2E2A24"/>
  <use href="#folder" x="910" y="110"/>
  <text x="958" y="128" class="mono path">elsewhere/</text>
  <text class="serif title"><tspan x="910" y="168">Somewhere else,</tspan><tspan x="910" y="196">with <tspan class="mono" font-size="20">--add-dir</tspan></tspan></text>
  <line class="rule" x1="906" y1="308" x2="1138" y2="308"/>
  <line class="rule" x1="906" y1="402" x2="1138" y2="402"/>
  <line class="rule" x1="906" y1="496" x2="1138" y2="496"/>
  <circle cx="926" cy="261" r="16" fill="#E57D50"/><use href="#cross" x="926" y="261"/>
  <text x="954" y="267" class="sans cell">not loaded</text>
  <circle cx="926" cy="355" r="16" fill="#5BBDB2"/><use href="#tick" x="926" y="355"/>
  <text x="954" y="361" class="sans cell">loads</text>
  <circle cx="926" cy="449" r="16" fill="#E57D50"/><use href="#cross" x="926" y="449"/>
  <text x="954" y="455" class="sans cell">not loaded</text>
  <circle cx="926" cy="543" r="16" fill="#E57D50"/><use href="#cross" x="926" y="543"/>
  <text x="954" y="549" class="sans cell">not loaded</text>

  <rect x="44" y="626" width="1112" height="52" rx="26" fill="#2E2A24"/>
  <text x="600" y="659" class="serif" font-size="22" font-style="italic" fill="#5BBDB2" text-anchor="middle">Start every chat in the brain's folder: the only place everything loads.</text>
</svg>
