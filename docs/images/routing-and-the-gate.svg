<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="724" viewBox="0 0 1200 724" role="img" aria-labelledby="title desc">
  <title id="title">Routing and the gate</title>
  <desc id="desc">Top, left to right: you ask, in your own words, "Publish the launch post." The routing map, docs/ROUTING.md, takes it: the request comes in as a site task, a router picks one routine by rule, site-publish-post, out of site-draft-post, site-publish-post and site-check-links. Then the routine runs its own steps, the same way every time, and the gate notes that it ran. Below, the gate, a hook in .claude/settings.json, checks every write to a folder a routine owns. Before the routine ran, Claude writes to site/content/ and is refused, and told: run site-publish-post first. After the routine ran, the same write is allowed and goes through. The map decides which routine; the gate makes sure it really ran.</desc>
  <style>
    .serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'DejaVu Serif', serif; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .card { fill: #FFFCF6; stroke: #E3D8C2; stroke-width: 2; }
    .stage { fill: #EFE7D7; }
    .head { font-size: 24px; fill: #1E1D1A; }
    .body { font-size: 17px; fill: #57524A; }
    .num { font-size: 18px; fill: #FFFCF6; font-weight: 700; }
    .say { font-size: 18px; fill: #F6F1E6; }
    .tag { font-size: 14.5px; fill: #57524A; }
    .node { font-size: 14.5px; fill: #8A8274; }
    .pick { font-size: 14.5px; font-weight: 700; fill: #FFFCF6; }
    .step { stroke: #8A8274; stroke-width: 2.5; }
    .soft { stroke: #D8CCB4; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#DED3BD"/>
    </pattern>
    <path id="tick" d="M-7 0.5 L-2 5.5 L7.5 -5.5" fill="none" stroke="#FFFCF6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="cross" d="M-6 -6 L6 6 M6 -6 L-6 6" fill="none" stroke="#FFFCF6" stroke-width="3.2" stroke-linecap="round"/>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A8274"/>
    </marker>
    <marker id="teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2B7A74"/>
    </marker>
    <marker id="terra" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#B5522B"/>
    </marker>
    <marker id="soft" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#D8CCB4"/>
    </marker>
  </defs>

  <rect width="1200" height="724" rx="24" fill="#F6F1E6"/>
  <rect width="1200" height="724" rx="24" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="722" rx="23" fill="none" stroke="#E3D8C2" stroke-width="2"/>
  <text x="44" y="56" class="mono" font-size="16" letter-spacing="3" fill="#B5522B">ROUTING AND THE GATE</text>

  <!-- 1 you ask -->
  <rect class="card" x="44" y="84" width="250" height="268" rx="16"/>
  <circle cx="80" cy="124" r="18" fill="#1E1D1A"/>
  <text x="80" y="130" class="sans num" text-anchor="middle">1</text>
  <text x="108" y="132" class="serif head">You ask</text>
  <rect x="64" y="196" width="210" height="80" rx="14" fill="#1E1D1A"/>
  <text class="sans say"><tspan x="84" y="229">Publish the</tspan><tspan x="84" y="255">launch post.</tspan></text>
  <text class="sans body"><tspan x="64" y="308">in your own words;</tspan><tspan x="64" y="332">no routine names needed</tspan></text>

  <!-- 2 the routing map -->
  <rect class="card" x="326" y="84" width="500" height="268" rx="16"/>
  <circle cx="362" cy="124" r="18" fill="#C9962E"/>
  <text x="362" y="130" class="sans num" text-anchor="middle">2</text>
  <text x="390" y="132" class="serif head">The routing map</text>
  <rect x="646" y="108" width="160" height="28" rx="14" fill="#EFE7D7"/>
  <text x="726" y="127" class="mono tag" text-anchor="middle">docs/ROUTING.md</text>
  <rect x="346" y="216" width="124" height="40" rx="20" fill="#EFE7D7"/>
  <text x="408" y="242" class="sans" font-size="16" fill="#1E1D1A" text-anchor="middle">a site task</text>
  <line class="step" x1="474" y1="236" x2="506" y2="236" marker-end="url(#arrow)"/>
  <path d="M546 204 L578 236 L546 268 L514 236 z" fill="#FFFCF6" stroke="#C9962E" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="546" y="296" class="sans" font-size="15.5" fill="#57524A" text-anchor="middle">picks by rule</text>
  <path class="soft" d="M580 236 C 602 236, 600 182, 622 182" marker-end="url(#soft)"/>
  <line x1="580" y1="236" x2="622" y2="236" stroke="#2B7A74" stroke-width="3" marker-end="url(#teal)"/>
  <path class="soft" d="M580 236 C 602 236, 600 290, 622 290" marker-end="url(#soft)"/>
  <rect x="630" y="164" width="176" height="36" rx="18" fill="#EFE7D7"/>
  <text x="718" y="187" class="mono node" text-anchor="middle">site-draft-post</text>
  <rect x="630" y="218" width="176" height="36" rx="18" fill="#2B7A74"/>
  <text x="718" y="241" class="mono pick" text-anchor="middle">site-publish-post</text>
  <rect x="630" y="272" width="176" height="36" rx="18" fill="#EFE7D7"/>
  <text x="718" y="295" class="mono node" text-anchor="middle">site-check-links</text>

  <!-- 3 the routine runs -->
  <rect class="card" x="858" y="84" width="298" height="268" rx="16"/>
  <circle cx="894" cy="124" r="18" fill="#2B7A74"/>
  <text x="894" y="130" class="sans num" text-anchor="middle">3</text>
  <text x="922" y="132" class="serif head">The routine runs</text>
  <rect x="878" y="218" width="258" height="36" rx="18" fill="#2B7A74"/>
  <text x="1007" y="241" class="mono pick" font-size="15" text-anchor="middle">site-publish-post</text>
  <text class="sans body"><tspan x="878" y="174">its own steps, the same</tspan><tspan x="878" y="196">way every time</tspan></text>
  <circle cx="892" cy="300" r="13" fill="#2B7A74"/><use href="#tick" x="892" y="300"/>
  <text x="914" y="306" class="sans" font-size="16" font-weight="600" fill="#2B7A74">the gate notes that it ran</text>

  <!-- steps -->
  <line class="step" x1="298" y1="236" x2="318" y2="236" marker-end="url(#arrow)"/>
  <line x1="810" y1="236" x2="848" y2="236" stroke="#2B7A74" stroke-width="3" marker-end="url(#teal)"/>

  <!-- the gate -->
  <text x="44" y="410" class="serif head">The gate</text>
  <text x="178" y="410" class="sans body">checks every write to a folder a routine owns</text>
  <text x="1156" y="410" class="mono tag" fill="#8A8274" text-anchor="end">.claude/settings.json</text>
  <rect class="card" x="44" y="432" width="544" height="190" rx="16" style="stroke: #B5522B; stroke-width: 2.5"/>
  <circle cx="82" cy="472" r="18" fill="#B5522B"/><use href="#cross" x="82" y="472"/>
  <text x="112" y="480" class="serif head">Before the routine ran</text>
  <rect x="68" y="513" width="306" height="42" rx="21" fill="#EFE7D7"/>
  <text x="88" y="540" class="sans" font-size="16.5" fill="#1E1D1A">Claude writes to <tspan class="mono" font-size="15.5">site/content/</tspan></text>
  <line x1="378" y1="534" x2="414" y2="534" stroke="#B5522B" stroke-width="2.5" marker-end="url(#terra)"/>
  <rect x="422" y="508" width="7" height="52" rx="3.5" fill="#B5522B"/>
  <text x="446" y="541" class="sans" font-size="19" font-weight="700" fill="#B5522B">refused</text>
  <rect x="68" y="570" width="496" height="36" rx="10" fill="#1E1D1A"/>
  <text x="88" y="594" class="sans" font-size="15.5" fill="#F6F1E6">Claude is told: <tspan class="mono" font-size="15" font-weight="700">run site-publish-post first</tspan></text>
  <rect class="card" x="612" y="432" width="544" height="190" rx="16" style="stroke: #2B7A74; stroke-width: 2.5"/>
  <circle cx="650" cy="472" r="18" fill="#2B7A74"/><use href="#tick" x="650" y="472"/>
  <text x="680" y="480" class="serif head">After the routine ran</text>
  <rect x="636" y="513" width="306" height="42" rx="21" fill="#EFE7D7"/>
  <text x="656" y="540" class="sans" font-size="16.5" fill="#1E1D1A">Claude writes to <tspan class="mono" font-size="15.5">site/content/</tspan></text>
  <rect x="990" y="508" width="7" height="52" rx="3.5" fill="none" stroke="#2B7A74" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="946" y1="534" x2="1024" y2="534" stroke="#2B7A74" stroke-width="2.5" marker-end="url(#teal)"/>
  <text x="1040" y="541" class="sans" font-size="19" font-weight="700" fill="#2B7A74">allowed</text>
  <rect x="636" y="570" width="496" height="36" rx="10" fill="#EFE7D7"/>
  <text x="656" y="594" class="sans" font-size="15.5" fill="#57524A">Claude is told nothing: <tspan fill="#1E1D1A" font-weight="600">the write goes through</tspan></text>

  <rect x="44" y="646" width="1112" height="52" rx="26" fill="#EFE7D7"/>
  <text x="600" y="679" class="serif" font-size="22" font-style="italic" fill="#2B7A74" text-anchor="middle">The map decides which routine; the gate makes sure it really ran.</text>
</svg>
