<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="512" viewBox="0 0 1200 512" role="img" aria-labelledby="title desc">
  <title id="title">How a brain grows</title>
  <desc id="desc">A timeline of five stops, each with a shelf that gets fuller. Day 1: eight meta skills, no routines of its own yet. Week 1: work that fits nothing gets noted, and a fact you checked gets recorded. Week 2: the second time a job comes up, it becomes a routine. Month 1: a handful of routines, a glossary, and what each app can and can't do. Later: routers for busy entry points, and unused routines merged away. On the shelves, mustard is the meta skills, teal is your routines, and plum is notes and facts. Nothing is written up front: it all grows from real work.</desc>
