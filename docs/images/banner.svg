<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Brain template for Claude Code</title>
  <desc id="desc">Teach Claude once. It remembers how. A folder of skills, checked facts and scripts that every Claude session starts from. Beside it, a chat where the person asks for a routine and Claude places, gates, checks and saves a new skill.</desc>
  <style>
    .serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'DejaVu Serif', serif; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#DED3BD"/>
    </pattern>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5A4A2E" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="440" rx="28" fill="#F6F1E6"/>
  <rect x="0" y="0" width="1280" height="440" rx="28" fill="url(#dots)"/>
  <rect x="1" y="1" width="1278" height="438" rx="27" fill="none" stroke="#E3D8C2" stroke-width="2"/>

  <!-- route map doodle behind the card -->
  <g fill="none" stroke="#C9B79A" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round">
    <path d="M700 380 C 760 300, 700 200, 780 140"/>
    <path d="M1230 70 C 1180 40, 1120 40, 1080 60"/>
  </g>
  <circle cx="700" cy="380" r="7" fill="#2B7A74"/>
  <circle cx="1230" cy="70" r="7" fill="#C9962E"/>

  <!-- words -->
  <text x="72" y="104" class="mono" font-size="19" letter-spacing="3" fill="#B5522B">BRAIN TEMPLATE · FOR CLAUDE CODE</text>
  <text x="68" y="186" class="serif" font-size="66" fill="#1E1D1A">Teach Claude once.</text>
  <text x="68" y="258" class="serif" font-size="66" font-style="italic" fill="#2B7A74">It remembers how.</text>
  <text class="sans" font-size="23" fill="#57524A">
    <tspan x="72" y="318">A folder of skills, checked facts and scripts</tspan>
    <tspan x="72" y="350">that every Claude session starts from, and that</tspan>
    <tspan x="72" y="382">gets better each time the work goes wrong.</tspan>
  </text>

  <!-- chat card -->
  <g filter="url(#lift)">
    <rect x="760" y="64" width="452" height="312" rx="18" fill="#FFFCF6" stroke="#E3D8C2" stroke-width="2"/>
  </g>
  <path d="M760 82 a18 18 0 0 1 18 -18 h416 a18 18 0 0 1 18 18 v24 h-452 z" fill="#EFE7D7"/>
  <circle cx="786" cy="88" r="6" fill="#D98466"/>
  <circle cx="806" cy="88" r="6" fill="#DDB45F"/>
  <circle cx="826" cy="88" r="6" fill="#7FB0A6"/>
  <text x="986" y="94" class="mono" font-size="15" fill="#8A8274" text-anchor="middle">my-homelab · Claude Code</text>

  <rect x="828" y="128" width="364" height="72" rx="14" fill="#1E1D1A"/>
  <text class="sans" font-size="17.5" fill="#F6F1E6">
    <tspan x="848" y="158">That's the second time we've renewed</tspan>
    <tspan x="848" y="184">these certificates. Make it a routine.</tspan>
  </text>

  <g class="mono" font-size="16.5">
    <text x="784" y="238"><tspan fill="#2B7A74">✓</tspan><tspan fill="#1E1D1A" dx="10">lab-renew-certs</tspan><tspan fill="#8A8274"> in the routing map</tspan></text>
    <text x="784" y="268"><tspan fill="#2B7A74">✓</tspan><tspan fill="#8A8274" dx="10">gate rule on its output</tspan></text>
    <text x="784" y="298"><tspan fill="#2B7A74">✓</tspan><tspan fill="#8A8274" dx="10">lint and doctor: nothing blocks</tspan></text>
    <text x="784" y="328"><tspan fill="#2B7A74">✓</tspan><tspan fill="#8A8274" dx="10">saved as </tspan><tspan fill="#B5522B">skill(lab-renew-certs)</tspan></text>
  </g>
  <rect x="784" y="346" width="10" height="18" fill="#B5522B" opacity="0.8"/>
</svg>
