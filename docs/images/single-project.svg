<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="634" viewBox="0 0 1200 634" role="img" aria-labelledby="title desc">
  <title id="title">A single-project brain</title>
  <desc id="desc">A brain called my-site for one project. Start every chat in the my-site folder: that is where the gate, settings and MCP servers load. Inside it, .claude/skills holds three skills, site-publish-post, site-check-links and site-update-deps, and docs holds the routing map, practices and the glossary. Also inside, in a dashed box, is site: the site's own repo, with its own history, never saved in the brain. It holds .git, CLAUDE.md, content and templates. Arrows run from each skill to site, because the skills name site paths. A note by site says site/CLAUDE.md loads when Claude works in its files.</desc>
  <style>
    .serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'DejaVu Serif', serif; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .card { fill: #FFFCF6; stroke: #E3D8C2; stroke-width: 2; }
    .stage { fill: #EFE7D7; }
    .row { fill: #FFFCF6; }
    .repo { fill: none; stroke: #A89F8E; stroke-width: 2; stroke-dasharray: 8 6; }
    .panel { font-size: 16.5px; fill: #57524A; }
    .skill { font-size: 17px; fill: #2B7A74; }
    .item { font-size: 17.5px; fill: #1E1D1A; }
    .body { font-size: 17.5px; fill: #57524A; }
    .tree { font-size: 17.5px; fill: #1E1D1A; }
    .branch { fill: #A89F8E; }
    .note { font-size: 16.5px; fill: #57524A; }
    .uses { stroke: #2B7A74; stroke-width: 2.5; fill: none; }
    .lead { stroke: #A89F8E; stroke-width: 1.5; stroke-dasharray: 2 5; fill: none; }
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#DED3BD"/>
    </pattern>
    <marker id="teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2B7A74"/>
    </marker>
    <path id="folder" d="M3 0 h12 l4 5 h16 a3 3 0 0 1 3 3 v10 a3 3 0 0 1 -3 3 h-32 a3 3 0 0 1 -3 -3 v-15 a3 3 0 0 1 3 -3 z" fill="#C9962E"/>
  </defs>

  <rect width="1200" height="634" rx="24" fill="#F6F1E6"/>
  <rect width="1200" height="634" rx="24" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="632" rx="23" fill="none" stroke="#E3D8C2" stroke-width="2"/>
  <text x="44" y="56" class="mono" font-size="16" letter-spacing="3" fill="#B5522B">SINGLE PROJECT</text>

  <!-- the brain folder -->
  <rect class="card" x="44" y="84" width="1112" height="514" rx="16"/>
  <path d="M45 100 a15 15 0 0 1 15 -15 h1080 a15 15 0 0 1 15 15 v50 h-1110 z" fill="#EFE7D7"/>
  <use href="#folder" x="70" y="107"/>
  <text x="122" y="126" class="mono" font-size="22" font-weight="700" fill="#1E1D1A">my-site/</text>
  <text x="256" y="125" class="sans" font-size="17.5" fill="#57524A"><tspan font-weight="700" fill="#2B7A74">start every chat here:</tspan> the gate, settings and MCP servers load</text>

  <!-- skills -->
  <rect class="stage" x="76" y="176" width="340" height="200" rx="12"/>
  <text x="96" y="207" class="mono panel">.claude/skills/</text>
  <rect class="row" x="96" y="224" width="300" height="38" rx="19"/>
  <text x="116" y="249" class="mono skill">site-publish-post</text>
  <rect class="row" x="96" y="272" width="300" height="38" rx="19"/>
  <text x="116" y="297" class="mono skill">site-check-links</text>
  <rect class="row" x="96" y="320" width="300" height="38" rx="19"/>
  <text x="116" y="345" class="mono skill">site-update-deps</text>

  <!-- docs -->
  <rect class="stage" x="76" y="400" width="340" height="174" rx="12"/>
  <text x="96" y="431" class="mono panel">docs/</text>
  <rect class="row" x="96" y="446" width="300" height="34" rx="17"/>
  <text x="116" y="469" class="sans item">routing map</text>
  <rect class="row" x="96" y="486" width="300" height="34" rx="17"/>
  <text x="116" y="509" class="sans item">practices</text>
  <rect class="row" x="96" y="526" width="300" height="34" rx="17"/>
  <text x="116" y="549" class="sans item">glossary</text>

  <!-- skills name site/ paths -->
  <text x="538" y="214" class="sans" font-size="16.5" fill="#57524A" text-anchor="middle">skills name <tspan class="mono" fill="#1E1D1A">site/</tspan> paths</text>
  <line class="uses" x1="404" y1="243" x2="648" y2="243" marker-end="url(#teal)"/>
  <line class="uses" x1="404" y1="291" x2="648" y2="291" marker-end="url(#teal)"/>
  <line class="uses" x1="404" y1="339" x2="648" y2="339" marker-end="url(#teal)"/>

  <!-- the project's own repo -->
  <rect class="repo" x="660" y="176" width="464" height="398" rx="14"/>
  <text x="688" y="217" class="mono" font-size="22" font-weight="700" fill="#1E1D1A">site/</text>
  <text class="sans body"><tspan x="688" y="248">the site's own repo: its own history,</tspan><tspan x="688" y="272">never saved in the brain</tspan></text>
  <g class="mono tree">
    <text x="688" y="326"><tspan class="branch">├─ </tspan>.git/</text>
    <text x="688" y="364"><tspan class="branch">├─ </tspan>CLAUDE.md</text>
    <text x="688" y="402"><tspan class="branch">├─ </tspan>content/</text>
    <text x="688" y="440"><tspan class="branch">└─ </tspan>templates/</text>
  </g>
  <path class="lead" d="M822 358 H950 V472"/>
  <rect x="688" y="476" width="408" height="76" rx="12" fill="#F3ECDF" stroke="#D8CCB4" stroke-width="1.5"/>
  <text class="sans note"><tspan x="708" y="507"><tspan class="mono" fill="#1E1D1A">site/CLAUDE.md</tspan> loads when Claude</tspan><tspan x="708" y="533">works in its files</tspan></text>
</svg>
