<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="512" viewBox="0 0 1200 512" role="img" aria-labelledby="title desc">
  <title id="title">Every chat starts with a health check</title>
  <desc id="desc">A new chat in the brain my-homelab. Claude opens with: Before we start, two things need attention. 3 changes aren't saved yet. Want me to save them? 1 hand-off from hub: Renew the certificates. Start on it? The person replies: Yes to both. It only speaks up when something needs you. On a healthy brain, it says nothing.</desc>
  <style>
    .serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'DejaVu Serif', serif; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .lead { font-size: 18px; fill: #1E1D1A; }
    .item { font-size: 17.5px; fill: #1E1D1A; }
    .ask { fill: #57524A; }
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#DED3BD"/>
    </pattern>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5A4A2E" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="512" rx="24" fill="#F6F1E6"/>
  <rect width="1200" height="512" rx="24" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="510" rx="23" fill="none" stroke="#E3D8C2" stroke-width="2"/>
  <text x="44" y="56" class="mono" font-size="16" letter-spacing="3" fill="#B5522B">EVERY CHAT STARTS WITH A HEALTH CHECK</text>

  <!-- the chat window -->
  <g filter="url(#lift)">
    <rect x="160" y="84" width="880" height="342" rx="18" fill="#FFFCF6" stroke="#E3D8C2" stroke-width="2"/>
  </g>
  <path d="M160 102 a18 18 0 0 1 18 -18 h844 a18 18 0 0 1 18 18 v24 h-880 z" fill="#EFE7D7"/>
  <circle cx="186" cy="105" r="6" fill="#D98466"/>
  <circle cx="206" cy="105" r="6" fill="#DDB45F"/>
  <circle cx="226" cy="105" r="6" fill="#7FB0A6"/>
  <text x="600" y="111" class="mono" font-size="15" fill="#8A8274" text-anchor="middle">my-homelab · new chat</text>

  <!-- Claude's opening message -->
  <rect x="192" y="150" width="680" height="140" rx="14" fill="#F3ECDF" stroke="#E3D8C2" stroke-width="1.5"/>
  <text x="216" y="186" class="sans lead">Before we start, two things need attention:</text>
  <circle cx="226" cy="221" r="6" fill="#C9962E"/>
  <text x="244" y="227" class="sans item">3 changes aren't saved yet. <tspan class="ask">Want me to save them?</tspan></text>
  <circle cx="226" cy="259" r="6" fill="#C9962E"/>
  <text x="244" y="265" class="sans item">1 hand-off from hub: Renew the certificates. <tspan class="ask">Start on it?</tspan></text>

  <!-- the reply -->
  <rect x="852" y="310" width="156" height="48" rx="14" fill="#1E1D1A"/>
  <text x="930" y="340" class="sans" font-size="17.5" fill="#F6F1E6" text-anchor="middle">Yes to both.</text>

  <!-- the reply box -->
  <rect x="192" y="372" width="816" height="38" rx="19" fill="#FFFCF6" stroke="#D8CCB4" stroke-width="1.5"/>
  <rect x="214" y="387" width="120" height="8" rx="4" fill="#E3D8C2"/>

  <text x="600" y="472" class="serif" font-size="21" font-style="italic" fill="#2B7A74" text-anchor="middle">It only speaks up when something needs you. On a healthy brain, it says nothing.</text>
</svg>
